rules:
  - id: csharp-insecure-binary-formatter
    languages: [csharp]
    message: BinaryFormatter is unsafe for deserializing data; use a safe serializer.
    severity: ERROR
    pattern-either:
      - pattern: new BinaryFormatter(...)
      - pattern: new System.Runtime.Serialization.Formatters.Binary.BinaryFormatter(...)
    paths:
      include:
        - /LocalPackages/**
        - /Assets/Editor/**

  - id: csharp-weak-cryptographic-hash
    languages: [csharp]
    message: MD5 and SHA-1 are unsuitable for security-sensitive hashing.
    severity: ERROR
    pattern-either:
      - pattern: MD5.Create(...)
      - pattern: SHA1.Create(...)
      - pattern: System.Security.Cryptography.MD5.Create(...)
      - pattern: System.Security.Cryptography.SHA1.Create(...)
    paths:
      include:
        - /LocalPackages/**
        - /Assets/Editor/**

  - id: python-shell-true
    languages: [python]
    message: subprocess with shell=True can enable command injection; pass an argument list instead.
    severity: ERROR
    pattern: subprocess.$FUNC(..., shell=True, ...)
    paths:
      include:
        - /scripts/**

  - id: python-unsafe-pickle-load
    languages: [python]
    message: Loading pickle data can execute arbitrary code; use a safe serialization format.
    severity: ERROR
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    paths:
      include:
        - /scripts/**

  # Semgrep has no PowerShell parser, so these run in generic mode over the .ps1
  # sources. PSScriptAnalyzer covers style and correctness; these cover the
  # execution and transport weaknesses a linter does not model.
  - id: powershell-invoke-expression
    languages: [generic]
    message: Invoke-Expression runs a string as code; run a downloaded script from a file instead.
    severity: ERROR
    pattern-either:
      - pattern: Invoke-Expression
      - pattern: iex
    paths:
      include:
        - /scripts/*.ps1

  - id: powershell-plaintext-secure-string
    languages: [generic]
    message: ConvertTo-SecureString -AsPlainText defeats the point of a SecureString.
    severity: ERROR
    pattern: ConvertTo-SecureString $... -AsPlainText
    paths:
      include:
        - /scripts/*.ps1

  - id: powershell-disabled-tls-validation
    languages: [generic]
    message: Skipping certificate or revocation checks removes transport authentication.
    severity: ERROR
    pattern-either:
      - pattern: -SkipCertificateCheck
      - pattern: ServerCertificateValidationCallback
    paths:
      include:
        - /scripts/*.ps1

  - id: bash-eval
    languages: [bash]
    message: Avoid eval in shell scripts because constructed input can become executable code.
    severity: ERROR
    pattern: eval $COMMAND
    paths:
      include:
        - /ci.sh
        - /scripts/**
        - /.githooks/**
