name: GameCI

on:
  push:
    branches: [ "main", "release" ]

  pull_request:
    branches: [ "main", "release" ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Static analysis, lint, and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.6
          enable-cache: true

      - name: Install shell quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt

      - name: Run repository gate
        run: ./ci.sh --skip-unity

  buildWebGL:
    name: Build for WebGL
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-WebGL
          restore-keys: |
            Library-build-
            Library-

      - name: Build Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BROCOLI_LICENSED_ASSET_KEY: ${{ secrets.BROCOLI_LICENSED_ASSET_KEY }}
        with:
          targetPlatform: WebGL

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

  deployPages:
    needs: buildWebGL
    if: github.event_name != 'pull_request'
    name: Deploy to Github Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build

      - name: Generate version.json
        run: |
          BUILD_ID="build-$(date +%s)-$(echo $GITHUB_SHA | cut -c1-7)"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_NUMBER=$GITHUB_RUN_NUMBER
          COMMIT_SHA=$GITHUB_SHA
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          
          cat > build/WebGL/version.json << EOF
          {
            "buildId": "$BUILD_ID",
            "buildTimestamp": "$BUILD_TIMESTAMP",
            "buildNumber": $BUILD_NUMBER,
            "commitSha": "$COMMIT_SHA",
            "description": "$COMMIT_MSG"
          }
          EOF
          
          echo "Generated version.json:"
          cat build/WebGL/version.json

      - name: Generate staging manifest (for main branch only)
        if: github.ref_name == 'main'
        run: |
          # Read the base name from release manifest and append " Staging"
          BASE_NAME=$(jq -r '.name' build/WebGL/manifest.json)
          SHORT_NAME=$(jq -r '.short_name' build/WebGL/manifest.json)
          
          # Update staging manifest with dynamic names
          jq --arg name "${BASE_NAME} Staging" \
             --arg short_name "${SHORT_NAME} Staging" \
             --arg desc "${BASE_NAME} Staging Build - Development/Testing Version" \
             '.name = $name | .short_name = $short_name | .description = $desc' \
             build/WebGL/manifest-staging.json > build/WebGL/manifest-staging-tmp.json
          mv build/WebGL/manifest-staging-tmp.json build/WebGL/manifest-staging.json
          
          echo "Generated staging manifest:"
          cat build/WebGL/manifest-staging.json

      - name: Deploy
        # uses: JamesIves/github-pages-deploy-action@v4.4.1
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: build/WebGL
          # main branch deploys to /BranchMain subpath, release branch deploys to root
          target-folder: ${{ github.ref_name == 'main' && 'BranchMain' || '' }}
          # Only clean the specific target folder, never touch other paths
          clean: true
          clean-exclude: |
            BranchMain/**
            .nojekyll
            CNAME
