name: Deploy GitHub Pages

on:
  push:
    branches: ["staging", "production"]
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - ".githooks/**"
      - ".quality/**"
      - ".semgrep.yml"
      - "Assets/Tests/**"
      - "ci.sh"
      - "format.sh"
      - "scripts/autoplay-*"
      - "scripts/check-webgl-build.cjs"
      - "scripts/check_source_size.py"
      - "scripts/install-git-hooks.sh"
      - "scripts/test-*.cjs"
      - "scripts/unity-*-check.*"
      - "scripts/unity-webgl-build.sh"
      - "scripts/webgl-smoke.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deployPages:
    name: Build and deploy GitHub Pages
    if: github.ref_name == 'staging' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    # Successful runs take about 30 minutes; fail rather than burn the default
    # six-hour ceiling when Unity or a deploy wedges.
    timeout-minutes: 90
    concurrency:
      # Both branches write to gh-pages, so serialize them to prevent push races.
      group: brocoli-gh-pages-deployment
      cancel-in-progress: false
    env:
      WEBGL_DEPLOY_DIR: build/WebGL/WebGL
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Configure licensed asset key
        shell: bash
        env:
          BROCOLI_LICENSED_ASSET_KEY: ${{ secrets.BROCOLI_LICENSED_ASSET_KEY }}
        run: |
          if [[ -z "${BROCOLI_LICENSED_ASSET_KEY:-}" ]]; then
            echo "Missing required BROCOLI_LICENSED_ASSET_KEY Actions secret." >&2
            exit 1
          fi

          umask 077
          printf 'BROCOLI_LICENSED_ASSET_KEY=%s\n' "$BROCOLI_LICENSED_ASSET_KEY" > .env

      # This is the only GitHub-hosted build: Pages needs a deployable player.
      # Tests and quality gates run locally through the pre-push hook instead.
      - name: Build Pages player
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Remove licensed asset build inputs
        if: always()
        shell: bash
        run: |
          rm -f .env

          licensed_asset_dir="Assets/Resources/Generated/Licensed"
          if [[ -d "$licensed_asset_dir" ]]; then
            sudo find "$licensed_asset_dir" -mindepth 1 -delete
          fi

          licensed_package_dir="Assets/Generated/Licensed"
          if [[ -d "$licensed_package_dir" ]]; then
            sudo find "$licensed_package_dir" -mindepth 1 -delete
          fi

      - name: Generate version.json
        shell: bash
        run: |
          BUILD_ID="build-$(date +%s)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_NUMBER=$GITHUB_RUN_NUMBER
          COMMIT_SHA=$GITHUB_SHA
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)

          jq -n \
            --arg buildId "$BUILD_ID" \
            --arg buildTimestamp "$BUILD_TIMESTAMP" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --arg commitSha "$COMMIT_SHA" \
            --arg description "$COMMIT_MSG" \
            '{buildId: $buildId, buildTimestamp: $buildTimestamp,
              buildNumber: $buildNumber, commitSha: $commitSha,
              description: $description}' \
            > "$WEBGL_DEPLOY_DIR/version.json"

      - name: Generate staging manifest
        if: github.ref_name == 'staging'
        shell: bash
        run: |
          BASE_NAME=$(jq -r '.name' "$WEBGL_DEPLOY_DIR/manifest.json")
          SHORT_NAME=$(jq -r '.short_name' "$WEBGL_DEPLOY_DIR/manifest.json")

          jq --arg name "${BASE_NAME} Staging" \
            --arg short_name "${SHORT_NAME} Staging" \
            --arg desc "${BASE_NAME} Staging Build - Development/Testing Version" \
            '.name = $name | .short_name = $short_name | .description = $desc' \
            "$WEBGL_DEPLOY_DIR/manifest-staging.json" > \
            "$WEBGL_DEPLOY_DIR/manifest-staging-tmp.json"
          mv \
            "$WEBGL_DEPLOY_DIR/manifest-staging-tmp.json" \
            "$WEBGL_DEPLOY_DIR/manifest-staging.json"

      - name: Deploy staging to BranchStaging
        if: github.ref_name == 'staging'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: ${{ env.WEBGL_DEPLOY_DIR }}
          target-folder: BranchStaging
          clean: true

      - name: Deploy staging to legacy BranchMain path
        if: github.ref_name == 'staging'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: ${{ env.WEBGL_DEPLOY_DIR }}
          target-folder: BranchMain
          clean: true

      - name: Deploy production to Pages root
        if: github.ref_name == 'production'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: ${{ env.WEBGL_DEPLOY_DIR }}
          clean: true
          # Production owns the root; preserve both staging paths during cleanup.
          clean-exclude: |
            BranchMain/**
            BranchStaging/**
            .nojekyll
            CNAME
