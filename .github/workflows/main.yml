name: GameCI

on:
  push:
    branches: [ "staging", "production" ]

  pull_request:
    branches: [ "staging", "production" ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Static analysis, lint, and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.6
          enable-cache: true

      - name: Install shell quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt

      - name: Run repository gate
        run: ./ci.sh --skip-unity

  buildWebGL:
    name: Build for WebGL
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Restore Library cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-build-WebGL
          restore-keys: |
            Library-build-
            Library-

      - name: Configure licensed asset key
        shell: bash
        env:
          BROCOLI_LICENSED_ASSET_KEY: ${{ secrets.BROCOLI_LICENSED_ASSET_KEY }}
        run: |
          if [[ -z "${BROCOLI_LICENSED_ASSET_KEY:-}" ]]; then
            echo "Missing required BROCOLI_LICENSED_ASSET_KEY Actions secret." >&2
            exit 1
          fi

          umask 077
          printf 'BROCOLI_LICENSED_ASSET_KEY=%s\n' "$BROCOLI_LICENSED_ASSET_KEY" > .env

      - name: Build Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Remove licensed asset build inputs
        if: always()
        shell: bash
        run: |
          rm -f .env

          licensed_asset_dir="Assets/Resources/Generated/Licensed"
          if [[ -d "$licensed_asset_dir" ]]; then
            sudo find "$licensed_asset_dir" -mindepth 1 -delete
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

  deployPages:
    needs: buildWebGL
    if: github.event_name != 'pull_request'
    name: Deploy to Github Pages
    runs-on: ubuntu-latest
    concurrency:
      group: brocoli-gh-pages-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build

      - name: Generate version.json
        run: |
          BUILD_ID="build-$(date +%s)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_NUMBER=$GITHUB_RUN_NUMBER
          COMMIT_SHA=$GITHUB_SHA
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          
          cat > build/WebGL/version.json << EOF
          {
            "buildId": "$BUILD_ID",
            "buildTimestamp": "$BUILD_TIMESTAMP",
            "buildNumber": $BUILD_NUMBER,
            "commitSha": "$COMMIT_SHA",
            "description": "$COMMIT_MSG"
          }
          EOF
          
          echo "Generated version.json:"
          cat build/WebGL/version.json

      - name: Generate staging manifest (for staging branch only)
        if: github.ref_name == 'staging'
        run: |
          # Read the base name from the production manifest and append " Staging"
          BASE_NAME=$(jq -r '.name' build/WebGL/manifest.json)
          SHORT_NAME=$(jq -r '.short_name' build/WebGL/manifest.json)
          
          # Update staging manifest with dynamic names
          jq --arg name "${BASE_NAME} Staging" \
             --arg short_name "${SHORT_NAME} Staging" \
             --arg desc "${BASE_NAME} Staging Build - Development/Testing Version" \
             '.name = $name | .short_name = $short_name | .description = $desc' \
             build/WebGL/manifest-staging.json > build/WebGL/manifest-staging-tmp.json
          mv build/WebGL/manifest-staging-tmp.json build/WebGL/manifest-staging.json
          
          echo "Generated staging manifest:"
          cat build/WebGL/manifest-staging.json

      - name: Deploy staging to BranchStaging
        if: github.ref_name == 'staging'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: build/WebGL
          target-folder: BranchStaging
          clean: true

      - name: Deploy staging to legacy BranchMain path
        if: github.ref_name == 'staging'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: build/WebGL
          target-folder: BranchMain
          clean: true

      - name: Deploy production to Pages root
        if: github.ref_name == 'production'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: build/WebGL
          clean: true
          # Production owns the root; preserve both staging paths during cleanup.
          clean-exclude: |
            BranchMain/**
            BranchStaging/**
            .nojekyll
            CNAME
